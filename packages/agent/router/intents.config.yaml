intents:
  - id: USER_REPOSITORY_MEMBERSHIP
    description: "User asks which repositories, projects, or codebases a person works in or contributes to"
    patterns:
      - "works in how many repo"
      - "which repos does"
      - "what repos does"
      - "repositories for"
      - "projects of"
      - "how many repos"
      - "contributing to"
      - "what projects does"
      - "which repositories"
      - "show me the repos"
      - "list repos for"
      - "codebases of"
      - "involved in which repos"
      - "repos does work on"
      - "what codebases"
      - "which projects does"
      - "what repositories is"
      - "repos worked on"
      - "repositories worked on"
      - "projects worked on"
      - "which repos is involved"
      - "which projects is involved"
    executionPlan:
      tool: "graph_search"
      action: "listNodes"
      target: "REPOSITORY"

  - id: ENTITY_CONTACT_INFO
    description: "User asks for email, role, designation, or contact details of a person"
    patterns:
      - "email and role"
      - "mail and role"
      - "role of"
      - "who is"
      - "contact info for"
      - "email address"
      - "tell me about"
      - "email of"
      - "role and email"
      - "what is the email"
      - "designation of"
      - "contact details"
      - "what is the role"
      - "what is the designation"
      - "job title of"
      - "position of"
      - "title of"
      - "get email"
      - "find email"
      - "show email"
    executionPlan:
      tool: "graph_search"
      action: "describeEntity"

  - id: REPOSITORY_RISK_AND_METRICS_QUERY
    description: "User asks about repository risk, highest/higher risk repo, repository comparison, bus factor, single point of failure, or repo health stats"
    patterns:
      - "which repo"
      - "which repository"
      - "higher risk"
      - "highest risk"
      - "most risky"
      - "riskiest"
      - "repo risk"
      - "repository risk"
      - "compare repo"
      - "compare repository"
      - "repo with bus factor"
      - "repository with bus factor"
      - "repos with bus factor"
      - "bus factor 1"
      - "single point of failure"
      - "spof repo"
      - "vulnerable repo"
      - "risky repository"
      - "codebase risk"
      - "project risk"
    executionPlan:
      tool: "sql_search"
      queryType: "repo_risk"

  - id: KNOWLEDGE_RISK_EVALUATION
    description: "User asks about knowledge risk score, departure risk, or impact if a person leaves, quits, or is fired"
    patterns:
      # Classic phrasings
      - "knowledge risk"
      - "leaves the cortex"
      - "what happens if"
      - "departure risk"
      - "if quit"
      - "if left"
      - "if leaves"
      - "impact if gone"
      - "what would happen if"
      - "risk if fired"
      - "departure impact"
      # NEW: "what breaks if X leaves" phrasing (previously missing - root cause of Vikram Patel bug)
      - "what breaks if"
      - "what fails if"
      - "what stops if"
      - "what changes if"
      - "breaks if leaves"
      - "fails if leaves"
      - "what breaks when"
      - "damage if leaves"
      # "losing X" phrasings
      - "if we lose"
      - "if we lost"
      - "loss of knowledge"
      # "gone" phrasings
      - "leaves the team"
      - "leaves the company"
      - "what if resigns"
      # Score-based ask
      - "departure score"
      - "risk of losing"
      - "knowledge loss if"
    executionPlan:
      tool: "knowledge_risk"

  - id: GLOBAL_ENTITY_COUNT
    description: "User asks how many total repositories, people, technologies, or other entities exist in the system"
    patterns:
      - "how many total"
      - "how many repositories exist"
      - "total count of"
      - "list all"
      - "count all"
      - "how many people"
      - "how many engineers"
      - "how many developers"
      - "how many technologies"
      - "how many repos are there"
      - "total number of"
      - "how many members"
      - "how many contributors"
      - "how many commits"
      - "count of repositories"
      - "number of engineers"
      - "show all engineers"
      - "show all repos"
      - "list everyone"
    executionPlan:
      tool: "graph_search"
      action: "countByLabel"

  - id: TECHNOLOGY_EXPERTISE_QUERY
    description: "User asks what technologies, skills, or tools a person uses or is expert in"
    patterns:
      - "technologies does use"
      - "what technologies"
      - "technology stack of"
      - "tech stack of"
      - "what tools does"
      - "frameworks does use"
      - "skills of"
      - "expertise of"
      - "what does know"
      - "what is good at"
      - "what languages"
      - "what does work with"
      - "proficient in"
      - "technical skills of"
      - "what stack does"
    executionPlan:
      tool: "graph_search"
      action: "listNodes"
      target: "TECHNOLOGY"

  - id: WHY_DECISION_QUERY
    description: "User asks why a technical decision was made, why something was replaced, or for architectural reasoning"
    patterns:
      - "why did we"
      - "why was replaced"
      - "why was removed"
      - "why was chosen"
      - "reason for replacing"
      - "reason we use"
      - "why switched to"
      - "why migrated to"
      - "decision to use"
      - "architectural decision"
      - "why not use"
      - "why did the team"
    executionPlan:
      tool: "vector_search"
