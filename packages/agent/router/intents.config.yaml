intents:
  - id: USER_REPOSITORY_MEMBERSHIP
    description: "User asks which repositories, projects, or codebases a person works in or contributes to"
    patterns:
      - "works in how many repo"
      - "which repos does"
      - "what repos does"
      - "repositories for"
      - "projects of"
      - "how many repos"
      - "contributing to"
      - "what projects does"
      - "which repositories"
      - "show me the repos"
      - "list repos for"
      - "codebases of"
      - "involved in which repos"
      - "repos does work on"
      - "what codebases"
      - "which projects does"
      - "what repositories is"
      - "repos worked on"
      - "repositories worked on"
      - "projects worked on"
      - "which repos is involved"
      - "which projects is involved"
    executionPlan:
      tool: "graph_search"
      action: "listNodes"
      target: "REPOSITORY"

  - id: ENTITY_CONTACT_INFO
    description: "User asks for email, role, designation, or contact details of a person"
    patterns:
      - "email and role"
      - "mail and role"
      - "role of"
      - "who is"
      - "contact info for"
      - "email address"
      - "tell me about"
      - "email of"
      - "role and email"
      - "what is the email"
      - "designation of"
      - "contact details"
      - "what is the role"
      - "what is the designation"
      - "job title of"
      - "position of"
      - "title of"
      - "get email"
      - "find email"
      - "show email"
    executionPlan:
      tool: "graph_search"
      action: "describeEntity"

  - id: REPOSITORIES_BY_BUS_FACTOR
    description: "User asks which repositories have bus factor X, bus factor 1, or are single point of failure / fragile repos"
    patterns:
      - "which repo has bus factor"
      - "which repos have bus factor"
      - "which repository has bus factor"
      - "which repositories have bus factor"
      - "repos with bus factor"
      - "repositories with bus factor"
      - "repos have bus factor"
      - "repositories have bus factor"
      - "bus factor = 1"
      - "bus factor 1"
      - "bus factor is 1"
      - "bus factor of 1"
      - "bus factor <= 1"
      - "single point of failure repos"
      - "single point of failure repository"
      - "spof repos"
      - "spof repository"
      - "fragile repos"
      - "fragile repositories"
    executionPlan:
      tool: "sql_search"
      queryType: "repos_by_bus_factor"
      params:
        threshold: 1

  - id: REPOSITORY_RISK_AND_METRICS_QUERY
    patterns:
      - "which repo is riskiest"
      - "which repo has highest risk"
      - "which repository is riskiest"
      - "which repository has highest risk"
      - "higher risk"
      - "highest risk"
      - "most risky"
      - "riskiest"
      - "repo risk"
      - "repository risk"
      - "compare repo"
      - "compare repository"
      - "vulnerable repo"
      - "risky repository"
      - "codebase risk"
      - "project risk"
    executionPlan:
      tool: "sql_search"
      queryType: "repo_risk"

  - id: KNOWLEDGE_RISK_EVALUATION
    description: "User asks about knowledge risk score, departure risk, or impact if a person leaves, quits, or is fired"
    patterns:
      # Classic phrasings
      - "knowledge risk"
      - "leaves the cortex"
      - "what happens if"
      - "departure risk"
      - "if quit"
      - "if left"
      - "if leaves"
      - "impact if gone"
      - "what would happen if"
      - "risk if fired"
      - "departure impact"
      # NEW: "what breaks if X leaves" phrasing (previously missing - root cause of Vikram Patel bug)
      - "what breaks if"
      - "what fails if"
      - "what stops if"
      - "what changes if"
      - "breaks if leaves"
      - "fails if leaves"
      - "what breaks when"
      - "damage if leaves"
      # "losing X" phrasings
      - "if we lose"
      - "if we lost"
      - "loss of knowledge"
      # "gone" phrasings
      - "leaves the team"
      - "leaves the company"
      - "what if resigns"
      # Score-based ask
      - "departure score"
      - "risk of losing"
      - "knowledge loss if"
    executionPlan:
      tool: "knowledge_risk"

  - id: GLOBAL_ENTITY_COUNT
    description: "User asks how many total repositories, people, technologies, or other entities exist in the system"
    patterns:
      - "how many total"
      - "how many repositories exist"
      - "total count of"
      - "list all"
      - "count all"
      - "how many people"
      - "how many engineers"
      - "how many developers"
      - "how many technologies"
      - "how many repos are there"
      - "total number of"
      - "how many members"
      - "how many contributors"
      - "count of repositories"
      - "number of engineers"
      - "show all engineers"
      - "show all repos"
      - "list everyone"
    executionPlan:
      tool: "graph_search"
      action: "countByLabel"

  - id: TECHNOLOGY_EXPERTISE_QUERY
    description: "User asks what technologies, skills, or tools a person uses or is expert in"
    patterns:
      - "technologies does use"
      - "what technologies"
      - "technology stack of"
      - "tech stack of"
      - "what tools does"
      - "frameworks does use"
      - "skills of"
      - "expertise of"
      - "what does know"
      - "what is good at"
      - "what languages"
      - "what does work with"
      - "proficient in"
      - "technical skills of"
      - "what stack does"
    executionPlan:
      tool: "graph_search"
      action: "listNodes"
      target: "TECHNOLOGY"

  - id: PRIMARY_OWNER_OF_REPO
    description: "User asks who is the primary owner or sole maintainer of a specific repository"
    patterns:
      - "primary owner of"
      - "owner of"
      - "who owns"
      - "who is the owner"
      - "who maintains"
      - "who is the maintainer"
      - "lead of"
      - "who leads"
    executionPlan:
      tool: "sql_search"
      queryType: "repo_details"

  - id: REPO_BUS_FACTOR_SINGLE
    description: "User asks for the bus factor, risk score, or health of a single specific repository"
    patterns:
      - "bus factor of"
      - "what is the bus factor of"
      - "bus factor for"
      - "risk score of"
      - "health of repository"
      - "metrics for repo"
    executionPlan:
      tool: "sql_search"
      queryType: "repo_details"

  - id: HEALTHY_VS_FRAGILE_REPOSITORIES
    description: "User asks for a comparison of healthy repositories versus fragile or at-risk repositories"
    patterns:
      - "healthy vs fragile"
      - "healthy repositories"
      - "fragile vs healthy"
      - "show healthy"
      - "healthy repos"
      - "list healthy repositories"
      - "good repo and bad repo"
    executionPlan:
      tool: "sql_search"
      queryType: "healthy_vs_fragile"

  - id: SUCCESSORS_FOR_PERSON
    description: "User asks who can take over, succeed, or replace an engineer if they leave or resign"
    patterns:
      - "who can take over"
      - "take over"
      - "takeover"
      - "successors for"
      - "successor for"
      - "who will replace"
      - "who can replace"
      - "replacement for"
      - "backup maintainer for"
      - "who can step in"
      - "who can assume ownership"
    executionPlan:
      tool: "knowledge_risk"

  - id: JIRA_HIGH_PRIORITY
    description: "User asks for high-priority Jira tickets, critical issues, or who is working on urgent tasks"
    patterns:
      - "high priority jira"
      - "high priority tickets"
      - "highest priority"
      - "critical jira"
      - "urgent tickets"
      - "p0 issues"
      - "p1 issues"
      - "who is working on high priority"
      - "show all high priority"
    executionPlan:
      tool: "sql_search"
      queryType: "jira_tickets"
      params:
        priority: "high"

  - id: SLACK_INCIDENT_SEARCH
    description: "User asks for Slack discussions, threads, or incident communications related to a topic"
    patterns:
      - "slack discussions"
      - "slack discussion"
      - "slack incident"
      - "slack thread"
      - "discussions are related to"
      - "slack message about"
      - "key rotation incident"
      - "kms incident"
      - "aws kms"
    executionPlan:
      tool: "sql_search"
      queryType: "slack_search"

